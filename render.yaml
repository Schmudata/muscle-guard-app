# Render-Blueprint für die Online-Version von Fala Já
services:
  - type: web
    name: fala-ja
    runtime: python
    plan: free
    rootDir: fala-ja
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
