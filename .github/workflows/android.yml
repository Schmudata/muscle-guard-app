name: BonQuest Android build

on:
  push:
    paths:
      - "BonQuest/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "BonQuest/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BonQuest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner ships with the Android SDK (ANDROID_HOME is preset).
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BonQuest-debug-apk
          path: BonQuest/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keep the latest APK in the branch too, so it can be downloaded without the Actions UI.
      - name: Commit APK to branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        working-directory: .
        run: |
          mkdir -p apk
          cp BonQuest/app/build/outputs/apk/debug/app-debug.apk apk/BonQuest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/BonQuest.apk
          git commit -m "Update BonQuest APK [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
