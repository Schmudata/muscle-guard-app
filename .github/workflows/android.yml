name: BonQuest Android build

on:
  push:
    paths:
      - "BonQuest/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "BonQuest/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BonQuest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner ships with the Android SDK (ANDROID_HOME is preset).
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BonQuest-debug-apk
          path: BonQuest/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
